<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="待辦清單 — 本地儲存、零後端的單檔 Web App">
<title>待辦清單 · Todo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f4f5fa;
  --card:#ffffff;
  --card-2:#edeff6;
  --text:#161927;
  --muted:#676d7f;
  --accent:#4f46e5;
  --accent-contrast:#ffffff;
  --border:#e4e6ee;
  --danger:#e11d48;
  --shadow:0 1px 2px rgba(20,22,40,.05),0 12px 32px rgba(20,22,40,.08);
}
[data-theme="dark"]{
  --bg:#0e1016;
  --card:#161925;
  --card-2:#1f2331;
  --text:#eceef5;
  --muted:#8a90a5;
  --accent:#8b93f8;
  --accent-contrast:#0e1016;
  --border:#272c3f;
  --danger:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;
  font-family:-apple-system,"SF Pro Text","Noto Sans TC","Microsoft JhengHei",system-ui,Segoe UI,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;padding:48px 16px 64px}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:24px;
  transition:background .25s,border-color .25s;
}

/* header */
.app-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.date{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.icon-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:.15s;
}
.icon-btn:hover{color:var(--text);background:var(--card-2)}
.icon-btn svg{width:18px;height:18px}

/* progress */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-top:18px}
.progress{flex:1;height:6px;border-radius:99px;background:var(--card-2);overflow:hidden}
#progressBar{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
.progress-label{font-size:12px;color:var(--muted);white-space:nowrap}

/* add form */
.add-row{display:flex;gap:10px;margin-top:16px}
#newTodo{
  flex:1;min-width:0;padding:12px 14px;font-size:15px;font-family:inherit;
  color:var(--text);background:var(--card);border:1px solid var(--border);
  border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s;
}
#newTodo::placeholder{color:var(--muted)}
#newTodo:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.add-btn{
  width:46px;height:46px;flex:0 0 auto;border:0;border-radius:12px;cursor:pointer;
  background:var(--accent);color:var(--accent-contrast);
  display:grid;place-items:center;transition:transform .12s,filter .15s;
}
.add-btn:hover{filter:brightness(1.08)}
.add-btn:active{transform:scale(.94)}
.add-btn svg{width:18px;height:18px}

/* filters */
.filters{
  display:flex;gap:4px;background:var(--card-2);
  padding:4px;border-radius:12px;margin:18px 0 14px;
}
.filters button{
  flex:1;display:flex;justify-content:center;align-items:center;gap:6px;
  padding:8px 6px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;
}
.filters button[aria-selected="true"]{
  background:var(--card);color:var(--text);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.filters .n{
  font-size:11px;font-weight:600;background:var(--card);
  color:var(--muted);padding:1px 7px;border-radius:99px;min-width:20px;text-align:center;
}
.filters button[aria-selected="true"] .n{background:var(--card-2)}

/* list */
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;
  transition:background .15s,opacity .15s,transform .15s;
}
.item:hover{background:var(--card-2)}
.item.leaving{opacity:0;transform:translateX(10px)}
.item .text{flex:1;min-width:0;font-size:15px;line-height:1.45;word-break:break-word}
.item.done .text{color:var(--muted);text-decoration:line-through}

/* custom checkbox */
.tick{position:relative;flex:0 0 auto;display:grid}
.tick input{position:absolute;opacity:0;width:1px;height:1px}
.tick .box{
  width:22px;height:22px;border:1.5px solid var(--muted);border-radius:7px;
  display:grid;place-items:center;transition:background .15s,border-color .15s;cursor:pointer;
}
.tick .box svg{
  width:11px;height:10px;fill:none;stroke:var(--accent-contrast);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .22s ease .04s;
}
.tick input:checked + .box{background:var(--accent);border-color:var(--accent)}
.tick input:checked + .box svg{stroke-dashoffset:0}
.tick input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* delete */
.del{
  width:30px;height:30px;flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;
  display:grid;place-items:center;background:transparent;color:var(--muted);
  font-size:18px;line-height:1;opacity:0;transition:.15s;
}
.item:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
@media (hover:none){.del{opacity:.55}}

/* footer */
.app-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
  font-size:13px;color:var(--muted);
}
.link-btn{
  background:none;border:0;font:inherit;font-size:13px;font-weight:600;
  color:var(--accent);cursor:pointer;padding:6px 8px;border-radius:8px;transition:.15s;
}
.link-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.link-btn:disabled{color:var(--muted);opacity:.5;cursor:default;background:none}

/* empty state */
.empty{text-align:center;color:var(--muted);font-size:14px;padding:34px 0 26px;margin:0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){
  .app{padding:24px 10px 40px}
  .panel{padding:18px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main class="app">
  <section class="panel" aria-label="待辦清單">
    <header class="app-header">
      <div>
        <h1>待辦清單</h1>
        <p class="date" id="today"></p>
      </div>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="切換深色／淺色主題">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress"><div id="progressBar"></div></div>
      <span class="progress-label" id="progressLabel"></span>
    </div>

    <form id="addForm" class="add-row" autocomplete="off">
      <input id="newTodo" name="text" type="text" maxlength="200" placeholder="加入新待辦…" aria-label="新待辦內容" required>
      <button class="add-btn" type="submit" aria-label="加入待辦">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <div class="filters" role="tablist" aria-label="篩選待辦">
      <button role="tab" aria-selected="true" data-filter="all" type="button">全部 <span class="n" data-n="all">0</span></button>
      <button role="tab" aria-selected="false" data-filter="active" type="button">未完成 <span class="n" data-n="active">0</span></button>
      <button role="tab" aria-selected="false" data-filter="done" type="button">已完成 <span class="n" data-n="done">0</span></button>
    </div>

    <ul id="list" class="todo-list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="app-footer">
      <span id="remaining"></span>
      <button id="clearDone" class="link-btn" type="button" disabled>清除已完成</button>
    </footer>
  </section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "hermes-todo/v1";
const THEME = "hermes-todo/theme";

const list = $("#list"), form = $("#addForm"), input = $("#newTodo");

let todos = load();
let filter = "all";

function load(){
  try{
    const r = localStorage.getItem(KEY);
    if(r){
      const p = JSON.parse(r);
      if(Array.isArray(p)) return p;
    }
  }catch(e){}
  return [];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(todos)); }catch(e){}
}
function uid(){
  return (crypto.randomUUID) ? crypto.randomUUID()
    : "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* ---------- date ---------- */
$("#today").textContent = new Date().toLocaleDateString("zh-Hant-HK",
  {year:"numeric", month:"long", day:"numeric", weekday:"long"});

/* ---------- theme ---------- */
const root = document.documentElement;
function setTheme(t){
  root.dataset.theme = t;
  try{ localStorage.setItem(THEME, t); }catch(e){}
  document.querySelector(".ic-moon").style.display = (t === "light") ? "block" : "none";
  document.querySelector(".ic-sun").style.display  = (t === "dark")  ? "block" : "none";
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME); }catch(e){}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
$("#themeToggle").addEventListener("click", () =>
  setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

/* ---------- item node ---------- */
function itemEl(t){
  const li = document.createElement("li");
  li.className = "item" + (t.done ? " done" : "");
  li.dataset.id = t.id;

  const label = document.createElement("label");
  label.className = "tick";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = t.done;
  cb.setAttribute("aria-label", (t.done ? "標記為未完成：" : "標記為已完成：") + t.text);
  const box = document.createElement("span");
  box.className = "box";
  box.innerHTML = '<svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5.5 4.2 8.5 11 1.5"/></svg>';
  const sr = document.createElement("span");
  sr.className = "sr-only";
  sr.textContent = "完成待辦：" + t.text;
  label.append(cb, box, sr);

  const text = document.createElement("span");
  text.className = "text";
  text.textContent = t.text;

  const del = document.createElement("button");
  del.className = "del";
  del.type = "button";
  del.setAttribute("aria-label", "刪除：" + t.text);
  del.innerHTML = "&#10005;";

  li.append(label, text, del);
  return li;
}

/* ---------- render ---------- */
function render(){
  const activeCount = todos.filter(t => !t.done).length;
  const doneCount   = todos.length - activeCount;
  const view = filter === "all"    ? todos
               : filter === "active" ? todos.filter(t => !t.done)
               :                       todos.filter(t =>  t.done);

  list.innerHTML = "";
  for(const t of view) list.appendChild(itemEl(t));

  const empty = $("#empty");
  empty.hidden = view.length > 0;
  if(view.length === 0){
    empty.textContent =
      filter === "all"    ? "📝  還沒有待辦項目，加入第一項開始吧"
      : filter === "active"? "🎉  全部完成，太棒了"
      :                       "⭐  尚無已完成項目";
  }

  document.querySelector('[data-n="all"]').textContent    = todos.length;
  document.querySelector('[data-n="active"]').textContent  = activeCount;
  document.querySelector('[data-n="done"]').textContent    = doneCount;
  document.querySelectorAll(".filters button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.filter === filter)));

  $("#remaining").textContent = todos.length
    ? activeCount + " 項未完成 / 共 " + todos.length + " 項"
    : "清單是空的";
  $("#clearDone").disabled = doneCount === 0;

  const pw = $("#progressWrap");
  pw.hidden = todos.length === 0;
  if(todos.length){
    const pct = Math.round(doneCount / todos.length * 100);
    $("#progressBar").style.width = pct + "%";
    $("#progressLabel").textContent = "已完成 " + doneCount + "/" + todos.length + "（" + pct + "%）";
  }
}

/* ---------- events ---------- */
form.addEventListener("submit", e => {
  e.preventDefault();
  const t = input.value.trim();
  if(!t) return;
  todos.push({id: uid(), text: t, done: false, ts: Date.now()});
  save(); render();
  input.value = "";
  input.focus();
});

list.addEventListener("change", e => {
  if(!e.target.matches(".item input")) return;
  const t = todos.find(x => x.id === e.target.closest(".item").dataset.id);
  if(!t) return;
  t.done = e.target.checked;
  save(); render();
});

list.addEventListener("click", e => {
  const d = e.target.closest(".del");
  if(!d) return;
  const li = d.closest(".item");
  li.classList.add("leaving");
  setTimeout(() => {
    todos = todos.filter(x => x.id !== li.dataset.id);
    save(); render();
  }, 150);
});

document.querySelectorAll(".filters button").forEach(b =>
  b.addEventListener("click", () => { filter = b.dataset.filter; render(); }));

$("#clearDone").addEventListener("click", () => {
  todos = todos.filter(t => !t.done);
  save(); render();
});

render();
</script>
</body>
</html>
